appId: com.ipscscore.app
productName: IPSCScore
copyright: Copyright © 2026 IPSCScore

directories:
  output: ../dist-electron
  buildResources: resources

files:
  - dist/**/*

extraResources:
  - from: frontend-dist-bundled
    to: frontend-dist
    filter:
      - "**/*"
  - from: dist-backend
    to: backend-dist
    filter:
      - "**/*"
  - from: resources/pg
    to: pg
    filter:
      - "**/*"
  - from: resources/vc_redist.x64.exe
    to: vc_redist.x64.exe

# After each arch build, thin universal PG binaries to single-arch
# so the universal merger can LIPO-merge them back properly.
afterPack: scripts/afterPack.js

# ── Artifact names ───────────────────────────────────────────────────────
# Every target includes ${arch}. Without it a Windows x64 and an arm64 build
# write the same `IPSCScore Setup <version>.exe`, so one silently overwrites the
# other — which the release workflow (two separate Windows jobs, one per arch)
# would then publish only once.
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
  icon: resources/icon.icns
  category: public.app-category.utilities
  # Hardened runtime needed for macOS distribution
  # hardenedRuntime: true
  # entitlements: resources/entitlements.mac.plist

win:
  artifactName: ${productName} Setup ${version}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.ico

nsis:
  include: resources/installer/vcredist.nsh

linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: AppImage
  icon: resources/icon.png
  category: Utility
