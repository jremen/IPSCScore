appId: com.ipscscore.app
productName: IPSCScore
copyright: Copyright © 2026 IPSCScore

# ── Linux packaging toolset ──────────────────────────────────────────────
# electron-builder's legacy AppImage toolset (0.0.0, the v26 default) embeds a
# FUSE2 runtime whose ARM64 binary links the unversioned `libz.so`. Distributions
# only ship `libz.so.1` unless the user installs the zlib development package, so
# ARM64 AppImages failed at startup with:
#   error while loading shared libraries: libz.so
# The static 1.0.3 runtime is statically linked and needs no host libz. Mounting
# an AppImage still requires FUSE2 on the target system, as with any AppImage. See
# https://github.com/electron-userland/electron-builder/issues/7835
toolsets:
  appimage: "1.0.3"

directories:
  output: ../dist-electron
  buildResources: resources

files:
  - dist/**/*

extraResources:
  - from: frontend-dist-bundled
    to: frontend-dist
    filter:
      - "**/*"
  - from: dist-backend
    to: backend-dist
    filter:
      - "**/*"
  - from: resources/pg
    to: pg
    filter:
      - "**/*"
  - from: resources/vc_redist.x64.exe
    to: vc_redist.x64.exe

# After each arch build, thin universal PG binaries to single-arch
# so the universal merger can LIPO-merge them back properly.
afterPack: scripts/afterPack.js

# ── Artifact names ───────────────────────────────────────────────────────
# Every target includes ${arch}. Without it a Windows x64 and an arm64 build
# write the same `IPSCScore Setup <version>.exe`, so one silently overwrites the
# other — which the release workflow (two separate Windows jobs, one per arch)
# would then publish only once.
mac:
  artifactName: ${productName}-${version}_Mac_${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.icns
  darkModeSupport: true
  category: public.app-category.utilities
  # Hardened runtime needed for macOS distribution
  # hardenedRuntime: true
  # entitlements: resources/entitlements.mac.plist
  # @electron/osx-sign walks the whole bundle and runs `codesign` on every file
  # it considers binary — that includes PostgreSQL's ~1,500 timezone data files.
  # They are plain data sealed by the app signature, so signing them one by one
  # only makes packaging take tens of minutes. PostgreSQL's bin/ and lib/ stay
  # signable because those executables and dylibs must run on arm64.
  signIgnore:
    - "/Contents/Resources/pg/share/"

win:
  artifactName: ${productName}-${version}_Windows_${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.ico

nsis:
  include: resources/installer/vcredist.nsh

linux:
  artifactName: ${productName}-${version}_Linux_${arch}.${ext}
  target:
    - target: AppImage
  # Install a full size-named PNG set into the AppImage's hicolor theme so desktop
  # environments have a proper launcher icon at every requested size.
  icon: resources/icons
  category: Utility
  # Keep the installed .desktop filename aligned with Electron's app_id / WM_CLASS
  # (derived from package.json "desktopName") and StartupWMClass.
  syncDesktopName: true
