services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipscscore
      POSTGRES_USER: ipscscore
      POSTGRES_PASSWORD: ipscscore_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipscscore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://ipscscore:ipscscore_dev@postgres:5432/ipscscore
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: npx tsx watch src/index.ts

  frontend:
    build:
      # Root context so the frontend image can install the private
      # @ipscscore/core workspace package (packages/core) via npm workspaces.
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # Set to your machine's LAN IP so the HTTPS cert is valid for iPhone access.
      # Example: 192.168.1.100 — find it with `ipconfig getifaddr en0`
      VITE_HOST: ${VITE_HOST:-}
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/public:/app/frontend/public
      - ./packages/core/src:/app/packages/core/src
    depends_on:
      - backend
    command: npm run dev --workspace frontend -- --host 0.0.0.0

volumes:
  pgdata:
