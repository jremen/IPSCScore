import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ── App version ──────────────────────────────────────────────────────────
// Mirrors mobile/package.json, which scripts/version-bump.mjs keeps in step with
// the rest of the workspace. versionCode must increase with every released build.
def appManifest = new JsonSlurper().parseText(rootProject.file('../../package.json').text)
def appVersionName = appManifest.version
def appVersionParts = appVersionName.tokenize('.')
def appVersionMajor = appVersionParts.size() > 0 && appVersionParts[0].isInteger() ? appVersionParts[0].toInteger() : 0
def appVersionMinor = appVersionParts.size() > 1 && appVersionParts[1].isInteger() ? appVersionParts[1].toInteger() : 0
def appVersionPatch = appVersionParts.size() > 2 && appVersionParts[2].isInteger() ? appVersionParts[2].toInteger() : 0
def appVersionCode = appVersionMajor * 10000 + appVersionMinor * 100 + appVersionPatch

// ── Release signing ──────────────────────────────────────────────────────
// Credentials live in mobile/android/keystore.properties (gitignored); see
// mobile/README.md §9. Debug builds do not need them. A release build without
// them is refused, because Gradle would otherwise emit an unsigned APK that
// Android rejects with INSTALL_PARSE_FAILED_NO_CERTIFICATES.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

if (!hasReleaseKeystore && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException(
        "Release signing is not configured: ${keystorePropertiesFile.absolutePath} is missing.\n" +
        "Create the keystore once with keytool, then write keystore.properties — see mobile/README.md §9."
    )
}

android {
    namespace = "com.ipscscore.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ipscscore.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// ── Output file names ────────────────────────────────────────────────────
// Gradle's defaults are the generic app-release.apk / app-debug.apk. Name the
// artifacts after the app instead, so a shared or downloaded APK says what it is:
//
//   release -> IPSCScore.apk          debug -> IPSCScore-debug.apk
//
// A release build only reaches signing when keystore.properties exists (guarded
// above), so the release name can always be trusted; if the guard is ever bypassed
// the "-unsigned" suffix keeps such an artifact from being shipped unnoticed.
androidComponents {
    onVariants(selector().all()) { variant ->
        def fileName
        if (variant.buildType == 'release') {
            fileName = hasReleaseKeystore ? 'IPSCScore.apk' : 'IPSCScore-unsigned.apk'
        } else {
            fileName = "IPSCScore-${variant.buildType ?: variant.name}.apk"
        }
        variant.outputs.each { output -> output.outputFileName.set(fileName) }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
