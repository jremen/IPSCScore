name: Release

# Builds the desktop installers (macOS / Windows / Linux) and the signed Android
# APK for a version, then publishes them all as a GitHub Release with a generated
# changelog.
#
# Trigger: pushing a version tag. `npm run version:*` bumps every package.json to
# the same version, so the usual flow is
#
#   npm run version:minor
#   git commit -am "chore: release 2.6.0"
#   git tag v2.6.0
#   git push origin main --tags
#
# The tag must be `v<major>.<minor>.<patch>` and must match every package.json;
# the run aborts before building anything otherwise. Full setup, secrets and
# troubleshooting: docs/releasing.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v2.5.4)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  # ── Validate the tag and generate the changelog ──────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      previous_tag: ${{ steps.previous.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve the tag and version
        id: meta
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not of the form v<major>.<minor>.<patch>."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag '$tag' does not exist. Create and push it first."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Check every package.json matches the tag
        run: node scripts/version-bump.mjs --check="${{ steps.meta.outputs.version }}"

      - name: Find the previous release tag
        id: previous
        run: |
          set -euo pipefail
          # `--match` keeps the search on release tags; `|| true` covers the very
          # first release, where ^ has no tag to find.
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${RELEASE_TAG}^" 2>/dev/null || true)"
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${previous:-<none, first release>}"

      - name: Generate the changelog
        run: |
          set -euo pipefail
          node scripts/generate-changelog.mjs \
            --version "${{ steps.meta.outputs.version }}" \
            --from "${{ steps.previous.outputs.previous_tag }}" \
            --to "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --output "CHANGELOG-${{ steps.meta.outputs.version }}.md"
          echo "----- CHANGELOG -----"
          cat "CHANGELOG-${{ steps.meta.outputs.version }}.md"

      - name: Upload the changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG-*.md
          if-no-files-found: error
          retention-days: 7

  # ── Desktop installers ───────────────────────────────────────────────────
  electron:
    name: Desktop (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS target is arm64-only (electron-builder.yml); the artifact
          # name takes the arch from the target, not from the runner.
          - os: macos-latest
            label: macOS arm64
            script: build:mac
            artifact: desktop-macos
            files: dist-electron/*.dmg
          - os: windows-latest
            label: Windows x64
            script: build:win
            artifact: desktop-windows-x64
            files: dist-electron/*.exe
          - os: windows-latest
            label: Windows arm64
            script: build:win-arm64
            artifact: desktop-windows-arm64
            files: dist-electron/*.exe
          - os: ubuntu-latest
            label: Linux x64
            script: build:linux
            artifact: desktop-linux-x64
            files: dist-electron/*.AppImage
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build ${{ matrix.label }}
        working-directory: electron
        env:
          # Unsigned builds: no Apple certificate is configured, so stop
          # electron-builder from hunting for one on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Several npm scripts use POSIX shell built-ins (rm -rf, cp, find);
          # on Windows npm would otherwise hand them to cmd.exe.
          npm_config_script_shell: bash
        run: npm run ${{ matrix.script }}

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  # ── Signed Android APK ───────────────────────────────────────────────────
  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install the Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set — the runner image provides it}"
          # Do not rely on the image's PATH setup for the SDK tools.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # Same as a local checkout, so Gradle finds the SDK either way.
          echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set — see docs/releasing.md."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/ipscscore-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # keystore.properties is gitignored and needs an absolute storeFile.
          cat > mobile/android/keystore.properties <<EOF
          storeFile=$keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$keystore" mobile/android/keystore.properties
          echo "Keystore restored: $(wc -c < "$keystore") bytes, alias '$KEY_ALIAS'"

      - name: Build the release APK
        run: npm run build:android:release

      - name: Verify the APK
        run: |
          set -euo pipefail
          apk="mobile/android/app/build/outputs/apk/release/IPSCScore.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" | head -1

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/IPSCScore.apk
          if-no-files-found: error
          retention-days: 7

  # ── Publish ──────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [prepare, electron, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1

      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Compose the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cp "release-assets/CHANGELOG-$VERSION.md" "$notes"

          {
            echo
            echo '## 📦 Downloads'
            echo
            for file in release-assets/*; do
              name="$(basename "$file")"
              [ "$name" = "CHANGELOG-$VERSION.md" ] && continue
              echo "- \`$name\` — $(du -h "$file" | cut -f1 | tr -d '[:space:]')"
            done
          } >> "$notes"

          echo "----- release notes -----"
          cat "$notes"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          assets=(release-assets/*)

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists — updating it."
            gh release edit "$RELEASE_TAG" \
              --title "IPSCScore $VERSION" \
              --notes-file "$notes"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "IPSCScore $VERSION" \
              --notes-file "$notes" \
              --verify-tag \
              "${assets[@]}"
          fi

          gh release view "$RELEASE_TAG" --json url,assets --jq '"\(.url) — \(.assets | length) assets"'
